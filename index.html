<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge Builder - Conjunctions Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .blueprint-panel {
            background-color: #1E3A8A;
            border: 4px solid #fff;
            border-radius: 4px;
            background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.3);
        }
        .brick-btn {
            background-color: #F59E0B;
            border: 3px solid #78350F;
            color: #451a03;
            transition: all 0.1s;
            box-shadow: 0 6px 0 #92400E;
        }
        .brick-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #92400E; }
        @media print { body * { visibility: hidden; } }
    </style>
</head>
<body class="bg-sky-200 text-white min-h-screen flex items-center justify-center overflow-y-auto relative">
    <div class="fixed inset-0 bg-sky-300 z-0 flex flex-col justify-end"><div class="w-full h-1/3 bg-stone-300 border-t-8 border-stone-400"></div></div>
    
    <div id="app" class="relative z-10 w-full max-w-3xl p-4 my-8">
        <!-- START SCREEN -->
        <div id="start-screen" class="blueprint-panel p-10 text-center mx-auto">
            <h1 class="text-4xl md:text-5xl font-bold mb-2 border-b-4 border-white pb-4 inline-block">Bridge Builder 🏗️</h1>
            <p class="text-blue-200 mb-8 font-bold">Conjunctions: And, But, Or, So, Because</p>
            <div class="space-y-4 max-w-md mx-auto">
                <input type="text" id="student-name" placeholder="ENTER NAME..." class="w-full p-4 bg-blue-900 border-2 border-white text-center font-bold uppercase">
                <button onclick="startGame()" id="start-btn" disabled class="w-full p-4 bg-yellow-500 text-black font-bold opacity-50">START PROJECT 👷</button>
                <button onclick="printWorksheet()" class="w-full p-3 bg-white text-blue-900 font-bold border-4 border-blue-900">PRINT BLUEPRINT 📄</button>
            </div>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="hidden flex flex-col gap-6">
            <!-- HEADER WITH BACK BUTTON -->
            <div class="flex justify-between items-center bg-yellow-400 p-3 rounded-lg border-b-4 border-yellow-600 shadow-md text-black">
                <div class="font-bold">👷 <span id="player-display">ENG. ALI</span></div>
                <div class="font-bold bg-white px-3 py-1 rounded border-2 border-black">SCORE: <span id="score-display">0</span></div>
                <!-- BUTTON BACK -->
                <button onclick="confirmExit()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded border-b-4 border-red-800 font-bold text-sm">
                    🏠 EXIT SITE
                </button>
            </div>

            <!-- QUESTION AREA -->
            <div class="blueprint-panel p-8 min-h-[200px] flex flex-col items-center justify-center text-center">
                <h2 id="sentence-display" class="text-2xl md:text-3xl font-bold leading-relaxed shadow-black drop-shadow-md">Loading...</h2>
                <div id="feedback-box" class="hidden mt-6 bg-white text-black p-4 rounded-lg border-l-8 border-red-500 shadow-lg w-full">
                    <p id="feedback-text" class="text-gray-800 mt-1">Explanation.</p>
                    <button onclick="nextLevel()" class="mt-3 bg-green-600 text-white px-6 py-2 rounded font-bold w-full">REPAIR ➡️</button>
                </div>
            </div>

            <!-- OPTIONS -->
            <div class="grid grid-cols-5 gap-2 md:gap-3">
                <button onclick="checkAnswer('and')" class="brick-btn p-3 rounded font-bold text-sm md:text-xl">AND</button>
                <button onclick="checkAnswer('but')" class="brick-btn p-3 rounded font-bold text-sm md:text-xl">BUT</button>
                <button onclick="checkAnswer('or')" class="brick-btn p-3 rounded font-bold text-sm md:text-xl">OR</button>
                <button onclick="checkAnswer('so')" class="brick-btn p-3 rounded font-bold text-sm md:text-xl">SO</button>
                <button onclick="checkAnswer('because')" class="brick-btn p-3 rounded font-bold text-xs md:text-lg">BECAUSE</button>
            </div>
            
            <div class="text-right text-xs text-stone-600 font-bold bg-white inline-block px-2 rounded self-end">PROGRESS: <span id="q-counter">0</span>/20</div>
        </div>

        <!-- END SCREEN -->
        <div id="end-screen" class="hidden blueprint-panel p-10 text-center">
            <h1 class="text-4xl font-bold text-yellow-400 mb-2">CONSTRUCTION COMPLETE 🏗️</h1>
            <div class="bg-white text-black p-6 border-l-8 border-green-500 mb-6 text-left">
                <p class="text-6xl font-bold text-blue-900 mb-2" id="final-score">0</p>
                <p class="text-gray-600 text-sm">ENGINEER: <span id="cert-name" class="font-bold uppercase">Name</span></p>
            </div>
            <button onclick="resetGame()" class="w-full p-3 bg-yellow-500 text-black font-bold mb-3">NEW PROJECT 🔨</button>
        </div>
    </div>

    <script>
        // --- 1. AUDITED DATASET (Natural English Structure) ---
        const questionData = [
            {q: "I like apples _____ oranges.", c: "and", e: "Use 'and' to combine two similar items."},
            {q: "She can sing _____ dance.", c: "and", e: "Use 'and' to list actions she can do."},
            {q: "My father bought bread _____ milk.", c: "and", e: "Use 'and' for a list of items."},
            {q: "He washed his hands _____ sat down.", c: "and", e: "Use 'and' to show sequence."},
            
            {q: "The soup is hot, _____ the juice is cold.", c: "but", e: "Use 'but' to show contrast (Hot vs Cold)."},
            {q: "He runs fast, _____ he didn't win.", c: "but", e: "Use 'but' for an unexpected result."},
            {q: "I want to play, _____ it is raining.", c: "but", e: "Use 'but' to show a problem."},
            {q: "She is small _____ very strong.", c: "but", e: "Use 'but' to compare qualities."},

            {q: "Do you want tea _____ coffee?", c: "or", e: "Use 'or' for a choice."},
            {q: "We can go to the park _____ the zoo.", c: "or", e: "Use 'or' for options."},
            {q: "Is that a cat _____ a dog?", c: "or", e: "Use 'or' when asking to identify."},
            {q: "Study hard, _____ you will fail.", c: "or", e: "Use 'or' for a warning."},

            {q: "It was raining, _____ we stayed inside.", c: "so", e: "Use 'so' to show result."},
            {q: "I was hungry, _____ I ate a burger.", c: "so", e: "Use 'so' for action taken."},
            {q: "He woke up late, _____ he missed the bus.", c: "so", e: "Use 'so' for consequence."},
            {q: "The room was dark, _____ I turned on the light.", c: "so", e: "Use 'so' for result."},

            {q: "I went to bed _____ I was tired.", c: "because", e: "Use 'because' to explain reason."},
            {q: "She is happy _____ she won.", c: "because", e: "Use 'because' for reason."},
            {q: "We cannot play _____ it is raining.", c: "because", e: "Use 'because' for reason."},
            {q: "He stayed home _____ he was sick.", c: "because", e: "Use 'because' for reason."}
        ];

        let deck=[], idx=0, score=0, name="";
        const startScreen=document.getElementById('start-screen'), gameScreen=document.getElementById('game-screen'), endScreen=document.getElementById('end-screen');
        
        document.getElementById('student-name').addEventListener('input', (e) => {
            name = e.target.value.trim();
            document.getElementById('start-btn').disabled = !name;
            document.getElementById('start-btn').classList.toggle('opacity-50', !name);
        });

        function startGame() {
            deck = [...questionData].sort(() => Math.random() - 0.5);
            idx=0; score=0;
            document.getElementById('player-display').textContent = "ENG. " + name.toUpperCase();
            startScreen.classList.add('hidden'); endScreen.classList.add('hidden'); gameScreen.classList.remove('hidden');
            showLevel();
        }

        function showLevel() {
            if(idx >= deck.length) return endGame();
            const item = deck[idx];
            document.getElementById('sentence-display').innerHTML = item.q.replace('_____', '<span class="bg-black text-yellow-400 px-3 rounded border-2 border-yellow-500 mx-1">?</span>');
            document.getElementById('feedback-box').classList.add('hidden');
            document.getElementById('q-counter').textContent = idx + 1;
            document.querySelectorAll('.brick-btn').forEach(b => b.disabled = false);
        }

        function checkAnswer(ans) {
            const item = deck[idx];
            document.querySelectorAll('.brick-btn').forEach(b => b.disabled = true);
            if(ans === item.c) {
                score += 10;
                document.getElementById('score-display').textContent = score;
                document.getElementById('sentence-display').innerHTML = item.q.replace('_____', `<span class="text-green-300 underline decoration-4">${item.c.toUpperCase()}</span>`);
                setTimeout(nextLevel, 1000);
            } else {
                document.getElementById('feedback-text').innerHTML = `Correct brick: <b class="text-blue-700 uppercase">${item.c}</b>.<br><i>${item.e}</i>`;
                document.getElementById('feedback-box').classList.remove('hidden');
            }
        }

        function nextLevel() { idx++; showLevel(); }
        function endGame() {
            gameScreen.classList.add('hidden'); endScreen.classList.remove('hidden');
            document.getElementById('final-score').textContent = score;
            document.getElementById('cert-name').textContent = name.toUpperCase();
        }
        function resetGame() { endScreen.classList.add('hidden'); startScreen.classList.remove('hidden'); }
        function confirmExit() { if(confirm("Exit site?")) resetGame(); }

        function printWorksheet() {
            const pWin = window.open('','_blank');
            let html = `<html><body style="font-family:Courier;padding:20px"><h1 style="text-align:center;border:2px solid black">BRIDGE BLUEPRINT</h1><p>Name: __________</p><hr>`;
            [...questionData].sort(()=>Math.random()-0.5).slice(0,10).forEach((q,i)=> html+=`<p><b>${i+1}.</b> ${q.q.replace('_____','_______')}</p>`);
            pWin.document.write(html); pWin.document.close(); setTimeout(()=>pWin.print(),500);
        }
    </script>
</body>
</html>
