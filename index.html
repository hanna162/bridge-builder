<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge Builder - Conjunctions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* UNIVERSAL FONT */
        body { font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }

        /* BLUEPRINT THEME */
        .blueprint-bg {
            background-color: #1e3a8a; /* Blueprint Blue */
            background-image: 
                linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .construct-panel {
            background: #172554;
            border: 2px solid #60a5fa;
            box-shadow: 5px 5px 0px #1d4ed8;
        }

        /* BRIDGE ANIMATION */
        @keyframes build {
            0% { width: 0%; opacity: 0; }
            100% { width: 100%; opacity: 1; }
        }
        .animate-build { animation: build 0.5s ease-out forwards; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            75% { transform: translateX(5px) rotate(5deg); }
        }
        .animate-collapse { animation: shake 0.4s ease-in-out; border-color: red !important; background: #450a0a !important; }

        /* PRINT HIDE */
        @media print { body * { visibility: hidden; } }
    </style>
</head>
<body class="blueprint-bg text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-3xl">
        
        <!-- SCREEN 1: START -->
        <div id="start-screen" class="construct-panel p-8 text-center rounded-xl">
            <h1 class="text-5xl font-bold text-yellow-400 mb-2">Bridge Builder 🌉</h1>
            <p class="text-blue-200 mb-8 font-mono">Connect ideas with Conjunctions</p>
            
            <input type="text" id="p-name" placeholder="Enter Engineer Name..." 
                class="w-full p-4 mb-4 bg-blue-900 border-2 border-blue-400 text-white rounded-lg text-center text-xl outline-none focus:border-yellow-400">
            
            <button id="start-btn" onclick="startGame()" disabled
                class="w-full p-4 bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-bold rounded-lg text-xl mb-3 opacity-50 transition">
                Start Construction 🏗️
            </button>
            <button onclick="printWorksheet()" class="w-full p-3 bg-white text-blue-900 font-bold rounded-lg">
                Print Blueprints 📄
            </button>
        </div>

        <!-- SCREEN 2: GAME -->
        <div id="game-screen" class="hidden flex flex-col gap-6">
            <!-- HUD -->
            <div class="flex justify-between items-center bg-blue-900 p-3 rounded-lg border border-blue-500">
                <div class="font-mono text-yellow-300">👷 <span id="player-display">Eng. Name</span></div>
                <div class="font-bold text-xl">Score: <span id="score">0</span></div>
            </div>

            <!-- CONSTRUCTION ZONE -->
            <div class="construct-panel p-8 rounded-xl relative min-h-[250px] flex flex-col md:flex-row items-center justify-between gap-4">
                <!-- Island 1 -->
                <div class="bg-slate-700 p-4 rounded-lg border-b-4 border-slate-900 w-full md:w-1/3 text-center">
                    <p id="sent-1" class="text-lg font-bold">I like apples</p>
                </div>

                <!-- The Gap (Bridge) -->
                <div class="flex-1 flex items-center justify-center relative w-full h-16">
                    <div class="absolute inset-x-0 top-1/2 h-1 bg-blue-800 -z-10"></div> <!-- Water/Gap -->
                    <div id="bridge-slot" class="w-24 h-12 border-2 border-dashed border-yellow-500 rounded flex items-center justify-center bg-blue-900 text-yellow-400 font-bold">
                        ?
                    </div>
                </div>

                <!-- Island 2 -->
                <div class="bg-slate-700 p-4 rounded-lg border-b-4 border-slate-900 w-full md:w-1/3 text-center">
                    <p id="sent-2" class="text-lg font-bold">I don't like oranges</p>
                </div>
            </div>

            <!-- TOOLS (OPTIONS) -->
            <div id="options-container" class="grid grid-cols-3 md:grid-cols-5 gap-2">
                <!-- Buttons injected by JS -->
            </div>

            <!-- EXPLANATION MODAL -->
            <div id="msg-box" class="hidden bg-slate-900 border-2 border-yellow-500 p-4 rounded-xl text-center">
                <p id="msg-text" class="text-lg mb-2"></p>
                <button onclick="nextLevel()" class="bg-green-600 px-6 py-2 rounded text-white font-bold">Next Project ➡️</button>
            </div>
        </div>

        <!-- SCREEN 3: END -->
        <div id="end-screen" class="hidden construct-panel p-8 text-center rounded-xl">
            <h1 class="text-4xl text-yellow-400 font-bold mb-4">Project Complete! ✅</h1>
            <p class="text-2xl mb-6">Final Score: <span id="final-score">0</span></p>
            <div class="flex flex-col gap-3">
                <button onclick="location.reload()" class="bg-yellow-500 text-blue-900 p-3 rounded font-bold">New Project 🔄</button>
                <button onclick="printWorksheet()" class="bg-white text-blue-900 p-3 rounded font-bold">Print Report 📄</button>
            </div>
        </div>
    </div>

    <script>
        // DATASET: CONJUNCTIONS
        const data = [
            {s1:"I wanted to buy candy", s2:"I didn't have money.", c:"but", e:"Use 'but' to show contrast."},
            {s1:"It was raining", s2:"we stayed inside.", c:"so", e:"Use 'so' to show the result."},
            {s1:"She likes to sing", s2:"she likes to dance.", c:"and", e:"Use 'and' to add similar information."},
            {s1:"We can go to the park", s2:"we can go to the zoo.", c:"or", e:"Use 'or' to show a choice."},
            {s1:"He went to bed", s2:"he was very tired.", c:"because", e:"Use 'because' to show the reason."},
            {s1:"I studied hard", s2:"I passed the test.", c:"so", e:"Use 'so' to show the result."},
            {s1:"Do you want tea", s2:"do you want coffee?", c:"or", e:"Use 'or' for choices."},
            {s1:"The car is old", s2:"it works very well.", c:"but", e:"Use 'but' for contrast."},
            {s1:"He is tall", s2:"handsome.", c:"and", e:"Use 'and' to join adjectives."},
            {s1:"I am hungry", s2:"I didn't eat lunch.", c:"because", e:"Use 'because' for the reason."},
            // 10 more to ensure variance
            {s1:"Ali is smart", s2:"Ali is kind.", c:"and", e:"Use 'and' to connect positive qualities."},
            {s1:"I ran fast", s2:"I missed the bus.", c:"but", e:"Use 'but' because the result was unexpected."},
            {s1:"She was sick", s2:"she went to the doctor.", c:"so", e:"Use 'so' for the result/action taken."},
            {s1:"Is that a cat", s2:"is that a dog?", c:"or", e:"Use 'or' for a question asking to choose."},
            {s1:"They are happy", s2:"they won the game.", c:"because", e:"Use 'because' to explain why they are happy."}
        ];

        let idx = 0, score = 0, qList = [];

        // INIT
        document.getElementById('p-name').addEventListener('input', (e)=>{
            document.getElementById('start-btn').disabled = e.target.value.length < 1;
            document.getElementById('start-btn').style.opacity = e.target.value.length < 1 ? 0.5 : 1;
        });

        function startGame(){
            qList = [...data].sort(()=>Math.random()-0.5);
            document.getElementById('player-display').innerText = document.getElementById('p-name').value;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            loadQ();
        }

        function loadQ(){
            if(idx >= qList.length) return endGame();
            
            const q = qList[idx];
            document.getElementById('sent-1').innerText = q.s1;
            document.getElementById('sent-2').innerText = q.s2;
            document.getElementById('bridge-slot').innerText = "?";
            document.getElementById('bridge-slot').className = "w-24 h-12 border-2 border-dashed border-yellow-500 rounded flex items-center justify-center bg-blue-900 text-yellow-400 font-bold";
            document.getElementById('msg-box').classList.add('hidden');

            const opts = ["and", "but", "so", "because", "or"];
            const cont = document.getElementById('options-container');
            cont.innerHTML = "";
            opts.forEach(o => {
                const btn = document.createElement('button');
                btn.className = "bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded border-b-4 border-blue-800 active:border-0 active:mt-1";
                btn.innerText = o;
                btn.onclick = () => check(o);
                cont.appendChild(btn);
            });
        }

        function check(ans){
            const q = qList[idx];
            const slot = document.getElementById('bridge-slot');
            
            // Disable all buttons
            Array.from(document.getElementById('options-container').children).forEach(b=>b.disabled=true);

            if(ans === q.c){
                score += 10;
                slot.innerText = ans;
                slot.className = "w-full h-12 bg-green-500 text-white font-bold rounded flex items-center justify-center animate-build";
                document.getElementById('score').innerText = score;
                playTone('correct');
                setTimeout(nextLevel, 1000);
            } else {
                slot.innerText = "CRASH!";
                slot.className = "w-24 h-12 bg-red-800 text-white font-bold rounded flex items-center justify-center animate-collapse";
                playTone('wrong');
                document.getElementById('msg-text').innerHTML = `Wrong! Correct bridge: <b class="text-yellow-400">${q.c}</b>.<br><span class="text-sm">${q.e}</span>`;
                document.getElementById('msg-box').classList.remove('hidden');
            }
        }

        function nextLevel(){
            idx++;
            loadQ();
        }

        function endGame(){
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
        }

        // AUDIO
        const actx = new (window.AudioContext||window.webkitAudioContext)();
        function playTone(t){
            const o = actx.createOscillator(); const g = actx.createGain();
            o.connect(g); g.connect(actx.destination);
            if(t=='correct'){ o.frequency.setValueAtTime(400, actx.currentTime); o.frequency.exponentialRampToValueAtTime(800, actx.currentTime+0.1); }
            else { o.type='sawtooth'; o.frequency.setValueAtTime(150, actx.currentTime); o.frequency.linearRampToValueAtTime(50, actx.currentTime+0.3); }
            o.start(); o.stop(actx.currentTime+0.3);
        }

        // PRINT
        function printWorksheet(){
            const w = window.open('','_blank');
            let h = `<html><head><style>body{font-family:Arial;padding:40px}.q{margin-bottom:15px;border-bottom:1px solid #ccc;padding:10px}</style></head><body><h1>Bridge Builder Worksheet</h1><p>Name: ________</p><hr>`;
            const pQ = [...data].sort(()=>Math.random()-0.5).slice(0,15);
            pQ.forEach((q,i)=> h+=`<div class="q"><b>${i+1}.</b> ${q.s1} _______ ${q.s2} <br>( and / but / so / because / or )</div>`);
            h+=`<h3>Answers:</h3><small>`;
            pQ.forEach((q,i)=> h+=`${i+1}.${q.c} `);
            h+=`</small></body></html>`;
            w.document.write(h); w.document.close(); setTimeout(()=>w.print(),500);
        }
    </script>
</body>
</html>
